
#user  nobody;
worker_processes 1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
  worker_connections 1024;
}


http {
  include mime.types;
  default_type application/octet-stream;

  types {
    application/javascript  js mjs;
    text/css                css;
    text/html               html;
  }

  sendfile on;
  client_max_body_size 160m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name localhost;

    location = /api {
      return 301 /api/;
    }

    location = /api/health/live {
      rewrite ^/api/health/live$ /health/live break;
      proxy_pass https://__BACKEND_API_HOST__;
      proxy_http_version 1.1;
      proxy_set_header Host __BACKEND_API_HOST__;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_ssl_server_name on;
      proxy_ssl_name __BACKEND_API_HOST__;
      proxy_connect_timeout 10s;
      proxy_read_timeout 10s;
      proxy_send_timeout 10s;
    }

    # Long-running uploads, attachment downloads and Excel exports need more
    # time than the default API request path.
    location ~* ^/api/(trading/.+/attachments(?:/.*)?|memos/.+/attachments(?:/.*)?|trading/export\.xlsx)$ {
      proxy_pass https://__BACKEND_API_HOST__;
      proxy_http_version 1.1;
      proxy_set_header Host __BACKEND_API_HOST__;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_set_header X-Request-Attempt $http_x_request_attempt;
      proxy_ssl_server_name on;
      proxy_ssl_name __BACKEND_API_HOST__;
      proxy_connect_timeout 10s;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_request_buffering off;
      proxy_buffering off;
    }

    location /api/ {
      proxy_pass https://__BACKEND_API_HOST__;
      proxy_http_version 1.1;
      proxy_set_header Host __BACKEND_API_HOST__;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_set_header X-Request-Attempt $http_x_request_attempt;
      proxy_ssl_server_name on;
      proxy_ssl_name __BACKEND_API_HOST__;
      proxy_connect_timeout 10s;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      index index.html;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
  }

  server {
    listen 8081;
    server_name _;

    location ~ ^/sina-quotes/(?<symbols>[A-Za-z0-9_.-]+(?:,[A-Za-z0-9_.-]+)*)$ {
      allow __SINA_RELAY_ALLOW_IP__;
      deny all;
      if ($args != "") { return 404; }

      resolver 127.0.0.11 valid=300s ipv6=off;
      set $sina_host hq.sinajs.cn;
      proxy_pass https://$sina_host/list=$symbols;
      proxy_http_version 1.1;
      proxy_pass_request_headers off;
      proxy_set_header Host hq.sinajs.cn;
      proxy_set_header Referer https://finance.sina.com.cn/;
      proxy_set_header User-Agent market-diary/1.0;
      proxy_ssl_server_name on;
      proxy_ssl_name hq.sinajs.cn;
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
      proxy_send_timeout 5s;
    }

    location / {
      return 404;
    }
  }
}
